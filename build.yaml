# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Dongle targets disabled: dongles are not available in Japan,
  # and this keyboard runs as a standard split (no dongle).
  # - board: nice_nano/nrf52840/zmk
  #   shield: cornix_dongle_adapter cornix_dongle_eyelash dongle_display
  #   snippet: studio-rpc-usb-uart nrf52840-nosd
  #   artifact-name: cornix_dongle_nosd
  # dongle screen not yet supports zephyr4
  # - board: seeeduino_xiao_ble
  #   shield: cornix_dongle_adapter dongle_screen
  #   snippet: studio-rpc-usb-uart
  #   artifact-name: cornix_dongle_zds_see
  # - board: nice_nano
  #   shield: cornix_dongle_adapter dongle_screen
  #   snippet: studio-rpc-usb-uart
  #   artifact-name: cornix_dongle_zds_nano
  - board: cornix_left
    shield: cornix_indicator
    # DIAG (diag/14-reconnect-heartbeat): zmk-usb-logging (not studio) so the
    # left central streams its log over USB CDC -- capture it in Tera Term
    # alongside the right half. Studio is disabled on this diag build by design.
    # Restore the line below to revert:
    #   snippet: studio-rpc-usb-uart nrf52840-nosd
    snippet: zmk-usb-logging nrf52840-nosd
    artifact-name: cornix_left_hb14B_nosd

  # Dongle target disabled (see above).
  # - board: cornix_ph_left
  #   # shield: cornix_indicator
  #   artifact-name: cornix_left_for_dongle_nosd

  - board: cornix_right
    shield: cornix_indicator
    # DIAG (diag/14-reconnect-heartbeat): zmk-usb-logging + CONFIG_ZMK_USB=y
    # (cornix_right_defconfig diag override) so the right peripheral also exposes
    # a USB CDC console. This is the half under study: watch its heartbeats after
    # the left central loses power. Restore by removing the snippet + override.
    snippet: zmk-usb-logging nrf52840-nosd
    artifact-name: cornix_right_hb14B_nosd

  - board: cornix_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_reset

  # Dongle target disabled (see above).
  # - board: nice_nano/nrf52840/zmk
  #   shield: settings_reset
  #   snippet: studio-rpc-usb-uart nrf52840-nosd
  #   artifact-name: reset_nicenano_nosd
