## WS2812 indicator driver (consumed by the stage-B self-built widget).
## In Zephyr 4.x the WS2812 strip is split per-bus; the SPI driver is
## what Cornix uses (see ws2812@0 under &spi3 in cornix.dtsi).
## WS2812_STRIP_SPI auto-enables when the DT has a status=okay
## worldsemi,ws2812-spi node and also selects SPI for us.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMK_EXT_POWER=y

# === DIAG (diag/14-reconnect-heartbeat) ===
# Turn a silent freeze into a named fault dump: HW stack protection puts an MPU
# guard at each thread stack's end, so a stack overflow (e.g. the split notify
# thread under USB logging -- Zephyr #44349 / ZMK #1245) traps as a FATAL.
# THREAD_NAME names the offending thread in the dump. Zephyr's default fatal
# behavior halts (no auto-reset) and the dump is verbose (CONFIG_FAULT_DUMP=2
# default), so it stays on the USB CDC console to read in Tera Term alongside
# the heartbeats stopping.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y

# Root-cause capture + auto-recovery for the #14 hard freeze (see src/diag_root.c).
# BT_CTLR_ASSERT_HANDLER routes every controller LL_ASSERT() to our own
# bt_ctlr_assert_handle() (independent of CONFIG_ASSERT, which we deliberately
# leave OFF to avoid surprise asserts elsewhere). HWINFO reads the reset cause,
# REBOOT lets the handler cold-reboot, WATCHDOG resets the SoC if a pure
# interrupt-locked spin (no LL_ASSERT) freezes it.
# BISECT C2 (hb14c2): INVERSE of C1 -- WATCHDOG ON, BT_CTLR_ASSERT_HANDLER OFF.
# C1 showed the freeze vanishes with the assert-handler recompile alone. C2 drops
# it (LL_ASSERT reverts to no-op = the freezing config) but keeps the watchdog, to
# (a) confirm the freeze RETURNS without the recompile = proving it was the
# suppressor, and (b) validate the WDT actually resets+recovers a real freeze
# (next boot reports reset_cause=WDT / "silent hard hang") -- which we have never
# yet observed because nothing has frozen since C1's config was added.
# CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y

# === EXPERIMENT B (diag/14-B-fatal-pc) ===
# CONFIG_BT_ASSERT is on by ZMK/Zephyr default, so LL_ASSERT was NEVER a no-op:
# with BT_CTLR_ASSERT_HANDLER OFF a violated controller invariant does
# printk()+k_oops(). If the #14 "silent freeze" is actually such an oops in the
# radio ISR (printk not flushing), the overridden k_sys_fatal_error_handler in
# diag_root.c records the faulting PC to __noinit RAM and reboots, so the next
# boot prints the PC = the controller location. If it is instead a pure irq-locked
# spin, no fatal fires and the WDT recovers it (report shows reset_cause=WDT).
# These are explicit only to document intent (both already default y).
CONFIG_BT_ASSERT=y
CONFIG_BT_ASSERT_VERBOSE=y

# Experiment 2 (enable ONLY after experiment 1 shows the split notify thread
# overflowing): raise the split peripheral notify stack from its default 756 and
# confirm the freeze disappears -- which would prove the diag freeze WAS that
# overflow, and is separate from the daily (no-logging) #14 reconnect failure.
# CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
